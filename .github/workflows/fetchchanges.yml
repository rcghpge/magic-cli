name: Magic Upstream Sync

on:
  schedule:
    - cron: "0 2 * * *"  # Daily at 2:00 AM UTC
  workflow_dispatch:

jobs:
  sync-fork:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0  # Fetch full history

      - name: Configure Git Identity
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Fetch and Merge Upstream with Exclusions
        run: |
          # Add upstream remote (read-only fetch)
          git remote add upstream https://github.com/modular/magic-docker.git
          
          # Fetch changes 
          git fetch upstream
          
          # Merge upstream/main, exclude README.md and LICENSE from upstream
          git merge upstream/main --allow-unrelated-histories -m "Sync with upstream" --no-commit || true
          
          # Revert README.md and LICENSE to fork's versions
          git checkout HEAD -- README.md LICENSE || true
          
          # Stage any reverted changes
          git add README.md LICENSE || true
          
          # Commit merge, preserve fork README.md and LICENSE
          git commit -m "Sync with upstream, preserving fork's README.md and LICENSE" || true
          
          # Push changes only to the fork origin (no upstream to Modular)
          if ! git diff origin/main --quiet; then
            git push origin main
          else
            echo "No changes to push; fork is up to date with upstream."
          fi
          
          # Remove upstream remote for clean updates
          git remote remove upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
