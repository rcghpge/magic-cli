name: Fetch Magic Upstream Changes

on:
  schedule:
    - cron: '0 2 * * *'  # Auto-syncs daily at 2:00 AM UTC
  workflow_dispatch:      # Manual sync option

jobs:
  sync-fork:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          ref: main  # Ensures we’re working on your fork’s main branch

      - name: Fetch and Merge Upstream
        run: |
          git remote add upstream https://github.com/modular/magic-docker.git
          git fetch upstream main
          git checkout main
          git merge upstream/main --no-edit
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
